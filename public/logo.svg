      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2E1A11"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#B47B45"/>
