    <path d="M3 21h18" />
    <path d="M3 10h18" />
    <path d="M12 2L3 7h18l-9-5z" />
    <path d="M6 10v7" />
    <path d="M10 10v7" />
    <path d="M14 10v7" />
    <path d="M18 10v7" />
  </g>

  <!-- Brand Typography: PennyWiseTrust -->
  <text x="96" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#2E1A11" letter-spacing="-0.5">PennyWise<tspan fill="#A16207">Trust</tspan></text>
  <text x="98" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#8D6E63" letter-spacing="3.5">PRIVATE BANKING</text>
